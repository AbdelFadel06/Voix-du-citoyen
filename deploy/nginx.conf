# Exemple de configuration nginx devant gunicorn (à adapter : domaine, certificats, chemins).

upstream voix_du_citoyen {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.exemple.bj;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.exemple.bj;

    ssl_certificate     /etc/letsencrypt/live/api.exemple.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.exemple.bj/privkey.pem;

    # Plus gros envoi : vidéo de 25 Mo + miniature de 5 Mo (POST /api/v1/medias/).
    client_max_body_size 32m;
    # Les envois lents (réseau mobile) sont reçus par nginx avant d'occuper gunicorn.
    proxy_request_buffering on;
    client_body_timeout 120s;

    # Réponses JSON compressées : moins de données mobiles.
    gzip on;
    gzip_types application/json application/vnd.oai.openapi+json text/css application/javascript;
    gzip_min_length 1024;

    location /static/ {
        alias /srv/voix-du-citoyen/staticfiles/;
        expires 30d;
    }

    # Uniquement sans stockage S3 (USE_S3=False) : fichiers envoyés par les utilisateurs.
    location /media/ {
        alias /srv/voix-du-citoyen/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://voix_du_citoyen;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
